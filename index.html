
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
<title>Music Reactive Visualizer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #080d19;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
}

#app {
  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

#stage {
  position: relative;
  width: 100%;
  height: 60dvh;
  min-height: 300px;
  max-height: 650px;
  overflow: hidden;
  background: radial-gradient(
    circle at center,
    #101d35 0%,
    #080d19 60%,
    #050810 100%
  );
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#status {
  position: absolute;
  left: 0;
  right: 0;
  top: max(16px, env(safe-area-inset-top));
  text-align: center;
  color: #a6bacb;
  font-size: 12px;
  pointer-events: none;
}

#panel {
  padding: 18px 20px max(26px, env(safe-area-inset-bottom));
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}

h1 {
  font-size: 19px;
  margin: 0 0 15px;
  font-weight: 650;
}

.mode-row, .source-row {
  display: flex;
  gap: 9px;
  margin: 12px 0;
}

button, .file-button {
  appearance: none;
  border: 1px solid #34435c;
  background: #142138;
  color: #e7f5ff;
  border-radius: 12px;
  padding: 13px 12px;
  font-size: 14px;
  text-align: center;
  cursor: pointer;
  flex: 1;
}

button.active {
  background: #15506a;
  border-color: #65d8f6;
}

button:disabled {
  opacity: .45;
}

.file-button {
  display: flex;
  align-items: center;
  justify-content: center;
}

input[type="file"] {
  display: none;
}

#songName {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #8fa9bd;
  font-size: 12px;
  margin: 8px 0;
}

audio {
  width: 100%;
  height: 45px;
  margin: 8px 0 12px;
}

.settings {
  display: grid;
  gap: 14px;
  margin-top: 14px;
}

.setting {
  display: grid;
  gap: 5px;
}

.setting-title {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #c7d8e9;
}

input[type="range"] {
  width: 100%;
  accent-color: #65dcfa;
}

input[type="color"] {
  width: 52px;
  height: 34px;
  border: 0;
  background: transparent;
}

.color-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #c7d8e9;
  font-size: 13px;
}

.note {
  margin-top: 17px;
  color: #8399b0;
  font-size: 11px;
  line-height: 1.7;
}

@media (min-width: 750px) {
  #stage {
    height: 66vh;
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="stage">
    <canvas id="visualizer"></canvas>
    <div id="status">音楽ファイルまたはマイクを選択してください</div>
  </div>

  <div id="panel">

    <h1>Music Reactive Visualizer</h1>

    <div class="mode-row">
      <button id="particleButton">Particle Sphere</button>
      <button id="circleButton" class="active">Circle Lines</button>
    </div>

    <div class="source-row">
      <label class="file-button" for="fileInput">
        音楽ファイルを選択
      </label>
      <input id="fileInput" type="file" accept="audio/*">

      <button id="micButton">マイクを使う</button>
    </div>

    <div id="songName">曲が選択されていません</div>

    <audio id="audioPlayer" controls playsinline></audio>

    <div class="settings">

      <div class="setting">
        <div class="setting-title">
          <span>全体の感度</span>
          <span id="sensitivityValue">1.5</span>
        </div>
        <input id="sensitivity" type="range"
               min="0.3" max="4" step="0.1" value="1.5">
      </div>

      <div class="setting">
        <div class="setting-title">
          <span>線の太さ</span>
          <span id="thicknessValue">4</span>
        </div>
        <input id="thickness" type="range"
               min="1" max="12" step="1" value="4">
      </div>

      <div class="setting">
        <div class="setting-title">
          <span>Bass 感度</span>
          <span id="bassValue">1.0</span>
        </div>
        <input id="bassGain" type="range"
               min="0" max="3" step="0.1" value="1">
      </div>

      <div class="setting">
        <div class="setting-title">
          <span>Mid 感度</span>
          <span id="midValue">1.0</span>
        </div>
        <input id="midGain" type="range"
               min="0" max="3" step="0.1" value="1">
      </div>

      <div class="setting">
        <div class="setting-title">
          <span>Treble 感度</span>
          <span id="trebleValue">1.0</span>
        </div>
        <input id="trebleGain" type="range"
               min="0" max="3" step="0.1" value="1">
      </div>

      <div class="color-row">
        <span>ライン・粒子のカラー</span>
        <input type="color" id="mainColor" value="#72ddff">
      </div>

    </div>

    <div class="note">
      iPhoneでは、音楽ファイルを選んで再生するか、
      マイクの使用を許可すると音に反応します。
      Spotifyなど別アプリの音声を直接解析することはできません。
    </div>

  </div>
</div>

<script>
"use strict";

// =====================================================
// Elements
// =====================================================

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const stage = document.getElementById("stage");
const statusElement = document.getElementById("status");

const audioPlayer = document.getElementById("audioPlayer");
const fileInput = document.getElementById("fileInput");

const particleButton = document.getElementById("particleButton");
const circleButton = document.getElementById("circleButton");
const micButton = document.getElementById("micButton");

const sensitivityInput = document.getElementById("sensitivity");
const thicknessInput = document.getElementById("thickness");

const bassInput = document.getElementById("bassGain");
const midInput = document.getElementById("midGain");
const trebleInput = document.getElementById("trebleGain");
const colorInput = document.getElementById("mainColor");

// =====================================================
// Application state
// =====================================================

let mode = "circle";

let audioContext = null;
let analyser = null;
let fileSource = null;
let micSource = null;
let micStream = null;

let activeSource = null;
let objectURL = null;

let frequencyData = null;

let bass = 0;
let mid = 0;
let treble = 0;

let bassPeak = 0;
let midPeak = 0;
let treblePeak = 0;

let previousBass = 0;
let previousMid = 0;
let previousTreble = 0;

let audioTime = 0;
let lastTime = performance.now();

let width = 0;
let height = 0;
let pixelRatio = 1;

let sensitivity = 1.5;
let thickness = 4;
let bassGain = 1;
let midGain = 1;
let trebleGain = 1;
let mainColor = "#72ddff";

const TWO_PI = Math.PI * 2;

function clamp(value, lo, hi) {
  return Math.max(lo, Math.min(hi, value));
}

function smooth(current, target, speed, dt) {
  return current +
    (target - current) *
    (1 - Math.exp(-speed * dt));
}

// =====================================================
// Canvas size
// =====================================================

function resizeCanvas() {
  const rect = stage.getBoundingClientRect();

  width = rect.width;
  height = rect.height;

  // Restrict high DPI for iPhone performance.
  pixelRatio = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(width * pixelRatio);
  canvas.height = Math.round(height * pixelRatio);

  ctx.setTransform(
    pixelRatio, 0,
    0, pixelRatio,
    0, 0
  );
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// =====================================================
// Audio context
// =====================================================

async function ensureAudio() {
  if (!audioContext) {
    const Context =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!Context) {
      throw new Error("Web Audio APIに対応していません");
    }

    audioContext = new Context();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.66;

    frequencyData = new Uint8Array(
      analyser.frequencyBinCount
    );
  }

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }
}

function disconnectSource(source) {
  if (!source) return;

  try {
    source.disconnect();
  } catch (error) {
    console.warn(error);
  }
}

function stopMicrophone() {
  disconnectSource(micSource);

  micSource = null;

  if (micStream) {
    micStream.getTracks().forEach(track => track.stop());
    micStream = null;
  }

  micButton.classList.remove("active");
}

function resetAudioLevels() {
  bass = mid = treble = 0;
  bassPeak = midPeak = treblePeak = 0;
  previousBass = previousMid = previousTreble = 0;
}

// =====================================================
// Local music file
// =====================================================

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];

  if (!file) return;

  try {
    await ensureAudio();

    stopMicrophone();

    // Create MediaElementAudioSourceNode only once.
    if (!fileSource) {
      fileSource =
        audioContext.createMediaElementSource(audioPlayer);
    }

    disconnectSource(fileSource);
    fileSource.connect(analyser);

    // Only file audio should play from speakers.
    try {
      analyser.disconnect();
    } catch (_) {}

    analyser.connect(audioContext.destination);

    if (objectURL) {
      URL.revokeObjectURL(objectURL);
    }

    objectURL = URL.createObjectURL(file);

    audioPlayer.src = objectURL;
    audioPlayer.load();

    activeSource = "file";

    document.getElementById("songName").textContent =
      file.name;

    resetAudioLevels();

    // Called from file selection; browsers may still
    // require tapping Play if autoplay is blocked.
    try {
      await audioPlayer.play();
      statusElement.textContent = "音楽ファイルを解析中";
    } catch (_) {
      statusElement.textContent =
        "再生ボタンを押してください";
    }

  } catch (error) {
    statusElement.textContent =
      "音声の準備に失敗しました";
    console.error(error);
  }
});

// Resume audio in response to playback controls.
audioPlayer.addEventListener("play", async () => {
  try {
    await ensureAudio();
  } catch (error) {
    console.error(error);
  }
});

// =====================================================
// Microphone
// =====================================================

micButton.addEventListener("click", async () => {
  if (micStream) {
    stopMicrophone();
    activeSource = null;
    resetAudioLevels();

    statusElement.textContent =
      "マイクを停止しました";

    return;
  }

  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        "マイクはHTTPSなどの安全な接続で利用してください"
      );
    }

    await ensureAudio();

    audioPlayer.pause();

    stopMicrophone();

    micStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        },
        video: false
      });

    micSource =
      audioContext.createMediaStreamSource(micStream);

    if (fileSource) {
      disconnectSource(fileSource);
    }

    try {
      analyser.disconnect();
    } catch (_) {}

    micSource.connect(analyser);

    // Do NOT connect microphone to speakers:
    // that would create feedback.
    activeSource = "mic";

    resetAudioLevels();

    micButton.classList.add("active");

    statusElement.textContent =
      "マイクから音声を解析中";

  } catch (error) {
    stopMicrophone();

    statusElement.textContent =
      "マイクが使えません。HTTPSと許可を確認してください";

    console.error(error);
  }
});

// =====================================================
// Audio band analysis
// =====================================================

function bandLevel(lowHz, highHz) {
  if (!analyser || !frequencyData) return 0;

  const hzPerBin =
    audioContext.sampleRate /
    analyser.fftSize;

  const start = Math.max(
    1,
    Math.floor(lowHz / hzPerBin)
  );

  const end = Math.min(
    frequencyData.length,
    Math.ceil(highHz / hzPerBin)
  );

  let power = 0;
  let count = 0;

  for (let i = start; i < end; i++) {
    const value = frequencyData[i] / 255;

    power += value * value;
    count++;
  }

  if (!count) return 0;

  return Math.sqrt(power / count);
}

function updateAudio(dt) {
  let b = 0;
  let m = 0;
  let t = 0;

  if (analyser && activeSource &&
      audioContext &&
      audioContext.state === "running") {

    analyser.getByteFrequencyData(frequencyData);

    b = bandLevel(20, 250);
    m = bandLevel(250, 2000);
    t = bandLevel(2000, 8000);

    // Amplify weak signals and preserve visible differences.
    b = clamp(
      Math.pow(b * sensitivity * bassGain * 2.5, 1.4),
      0, 1
    );

    m = clamp(
      Math.pow(m * sensitivity * midGain * 3.0, 1.4),
      0, 1
    );

    t = clamp(
      Math.pow(t * sensitivity * trebleGain * 3.6, 1.4),
      0, 1
    );
  }

  // Short burst on sudden volume increases.
  bassPeak = Math.max(
    bassPeak * Math.exp(-8 * dt),
    clamp((b - previousBass) * 2.7, 0, 1)
  );

  midPeak = Math.max(
    midPeak * Math.exp(-11 * dt),
    clamp((m - previousMid) * 2.4, 0, 1)
  );

  treblePeak = Math.max(
    treblePeak * Math.exp(-16 * dt),
    clamp((t - previousTreble) * 2.2, 0, 1)
  );

  previousBass = b;
  previousMid = m;
  previousTreble = t;

  bass = smooth(bass, b, b > bass ? 13 : 5, dt);
  mid = smooth(mid, m, m > mid ? 17 : 7, dt);
  treble = smooth(treble, t, t > treble ? 24 : 9, dt);
}

// =====================================================
// Colors
// =====================================================

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function rgba(alpha, brightness = 1) {
  const c = hexToRgb(mainColor);

  return `rgba(
    ${Math.min(255, Math.round(c.r * brightness))},
    ${Math.min(255, Math.round(c.g * brightness))},
    ${Math.min(255, Math.round(c.b * brightness))},
    ${alpha}
  )`;
}

// =====================================================
// Circle lines
// Same center + same baseline radius
// =====================================================

const CIRCLE_POINTS = 360;

function circleWave(band, angle, time) {
  if (band === 0) {
    // Bass: wide, broad and slow waves.
    const a = Math.sin(angle * 2 + time * 1.2);
    const b = Math.sin(angle * 5 - time * .9);
    const c = Math.sin(angle + time * .55);

    return clamp(
      .45 +
      .35 * Math.pow(Math.max(0, a), 1.6) +
      .15 * Math.pow(Math.max(0, b), 2) +
      .12 * (c + 1) / 2,
      0, 1
    );
  }

  if (band === 1) {
    // Mid: SHARP SPIKES (the selected C design).
    const a = Math.sin(
      angle * 11 - time * 1.5
    );

    const b = Math.sin(
      angle * 17 + time * 2
    );

    return clamp(
      .06 +
      .78 * Math.pow(Math.max(0, a), 14) +
      .16 * Math.pow(Math.max(0, b), 8),
      0, 1
    );
  }

  // Treble: finer and faster peaks.
  const a = Math.sin(angle * 21 + time * 6.5);
  const b = Math.sin(angle * 33 - time * 7.2);

  return clamp(
    .08 +
    .55 * Math.pow(Math.max(0, a), 3) +
    .35 * Math.pow(Math.max(0, b), 4),
    0, 1
  );
}

function drawCircle() {
  const cx = width / 2;
  const cy = height / 2;

  // Keep enough space for the largest spikes.
  const baseRadius =
    Math.min(width, height) * .235;

  const maxExtension =
    Math.min(width, height) * .205;

  const levels = [
    clamp(bass * .85 + bassPeak * .7, 0, 1),
    clamp(mid * .85 + midPeak * .7, 0, 1),
    clamp(treble * .85 + treblePeak * .7, 0, 1)
  ];

  const amplitudes = [1.0, .85, .65];

  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  for (let band = 0; band < 3; band++) {
    const level = levels[band];

    ctx.beginPath();

    for (let i = 0; i <= CIRCLE_POINTS; i++) {
      const angle = i / CIRCLE_POINTS * TWO_PI;

      const wave = circleWave(
        band,
        angle,
        audioTime
      );

      // All bands start at the exact same radius.
      const radius =
        baseRadius +
        maxExtension *
        amplitudes[band] *
        level *
        (.22 + .78 * wave);

      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }

    const alpha =
      clamp(.48 + level * .5, 0, 1);

    ctx.shadowBlur =
      8 + level * 16;

    ctx.shadowColor = rgba(.6);

    ctx.strokeStyle = rgba(
      alpha,
      band === 0 ? 1 : band === 1 ? .88 : .78
    );

    ctx.lineWidth = thickness;

    ctx.stroke();
  }

  ctx.shadowBlur = 0;
}

// =====================================================
// Particle sphere
// =====================================================

const PARTICLE_COUNT = 800;
const particles = [];

function makeParticles() {
  particles.length = 0;

  // Fibonacci sphere: evenly spaced sphere points.
  const goldenAngle =
    Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const y =
      1 - (i / (PARTICLE_COUNT - 1)) * 2;

    const ringRadius =
      Math.sqrt(Math.max(0, 1 - y * y));

    const angle = goldenAngle * i;

    particles.push({
      x: Math.cos(angle) * ringRadius,
      y: y,
      z: Math.sin(angle) * ringRadius,
      phase: i * .17,
      band: i % 3
    });
  }
}

makeParticles();

function drawParticles() {
  const cx = width / 2;
  const cy = height / 2;

  const radius =
    Math.min(width, height) * .275;

  const rotation = audioTime * .24;

  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);

  const levels = [
    clamp(bass + bassPeak * .7, 0, 1),
    clamp(mid + midPeak * .6, 0, 1),
    clamp(treble + treblePeak * .5, 0, 1)
  ];

  const projected = [];

  for (const p of particles) {
    const bandLevel = levels[p.band];

    const rippling =
      Math.sin(
        p.phase +
        audioTime *
        (p.band === 0 ? 1.4 :
         p.band === 1 ? 2.9 : 5.5)
      );

    const expansion =
      1 +
      bandLevel *
      (p.band === 0 ? .44 :
       p.band === 1 ? .34 : .26) *
      (.75 + .25 * rippling);

    const x = p.x * expansion;
    const y = p.y * expansion;
    const z = p.z * expansion;

    const xr = x * cosR - z * sinR;
    const zr = x * sinR + z * cosR;

    const perspective =
      2.9 / (2.9 - zr * .35);

    projected.push({
      x: cx + xr * radius * perspective,
      y: cy + y * radius * perspective,
      z: zr,
      size:
        (p.band === 0 ? 1.65 :
         p.band === 1 ? 1.35 : 1.1) *
        perspective *
        (1 + bandLevel * 1.0),
      alpha: clamp(
        .26 + (zr + 1) * .23 +
        bandLevel * .35,
        .15, 1
      )
    });
  }

  // Back-to-front layering.
  projected.sort((a, b) => a.z - b.z);

  ctx.shadowColor = rgba(.75);
  ctx.shadowBlur = 5;

  for (const p of projected) {
    ctx.fillStyle = rgba(p.alpha);

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      TWO_PI
    );

    ctx.fill();
  }

  ctx.shadowBlur = 0;
}

// =====================================================
// Animation
// =====================================================

function animate(now) {
  requestAnimationFrame(animate);

  const dt = clamp(
    (now - lastTime) / 1000,
    0,
    .05
  );

  lastTime = now;
  audioTime += dt;

  updateAudio(dt);

  ctx.clearRect(0, 0, width, height);

  if (mode === "circle") {
    drawCircle();
  } else {
    drawParticles();
  }
}

requestAnimationFrame(animate);

// =====================================================
// Mode controls
// =====================================================

function setMode(next) {
  mode = next;

  particleButton.classList.toggle(
    "active",
    mode === "particle"
  );

  circleButton.classList.toggle(
    "active",
    mode === "circle"
  );
}

particleButton.addEventListener(
  "click",
  () => setMode("particle")
);

circleButton.addEventListener(
  "click",
  () => setMode("circle")
);

// =====================================================
// Settings / local storage
// =====================================================

const controls = [
  ["sensitivity", "sensitivityValue", v => sensitivity = v],
  ["thickness", "thicknessValue", v => thickness = v],
  ["bassGain", "bassValue", v => bassGain = v],
  ["midGain", "midValue", v => midGain = v],
  ["trebleGain", "trebleValue", v => trebleGain = v]
];

for (const [id, valueId, setter] of controls) {
  const input = document.getElementById(id);
  const output = document.getElementById(valueId);

  const stored = localStorage.getItem(id);

  if (stored !== null) {
    input.value = stored;
  }

  function update() {
    const value = Number(input.value);

    setter(value);
    output.textContent = input.value;

    localStorage.setItem(id, input.value);
  }

  input.addEventListener("input", update);
  update();
}

const savedColor =
  localStorage.getItem("mainColor");

if (savedColor) {
  colorInput.value = savedColor;
}

mainColor = colorInput.value;

colorInput.addEventListener("input", () => {
  mainColor = colorInput.value;

  localStorage.setItem(
    "mainColor",
    mainColor
  );
});

window.addEventListener("pagehide", () => {
  stopMicrophone();
});

</script>
</body>
</html>
